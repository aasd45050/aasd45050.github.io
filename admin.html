<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d0b">
  <title>Admin — ORB1TAL</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/config.js"></script>
  <script defer src="assets/js/games.js"></script>
  <script defer src="assets/js/admin.js"></script>
</head>
<body>
  <main class="admin-page">
    <header class="admin-header">
      <h1>ORB1TAL Admin</h1>
      <a href="./">← Back to games</a>
    </header>
    <section class="admin-panel" id="loginPanel">
      <h2>Admin login</h2>
      <p>Enter the admin password to manage game availability.</p>
      <form class="admin-form" id="loginForm">
        <input id="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password" required>
        <button class="admin-action" type="submit">Log in</button>
      </form>
      <p class="admin-error" id="loginError" role="alert"></p>
    </section>
    <section id="dashboard" hidden>
      <p>Change a game's status below. Changes are saved in this browser and appear on the homepage on this same browser/device.</p>
      <div class="admin-list" id="adminGameList"></div>
      <p class="admin-save-note" id="saveNote" aria-live="polite"></p>
      <button class="admin-action" id="logoutButton" type="button">Log out</button>
    </section>
  </main>
</body>
</html>
