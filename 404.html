<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d0b">
  <title>404 — ORB1TAL</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .not-found{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}
    .not-found-inner{max-width:540px}
    .not-found-code{font:700 clamp(92px,20vw,160px)/.9 'Space Grotesk',sans-serif;letter-spacing:-.09em;color:var(--accent);margin:0 0 20px}
    .not-found h1{font:700 clamp(25px,5vw,38px)/1.15 'Space Grotesk',sans-serif;margin:0 0 12px;color:var(--text)}
    .not-found p{color:var(--muted);font-size:15px;line-height:1.7;margin:0 auto 28px}
    .not-found a{display:inline-flex;align-items:center;justify-content:center;padding:12px 19px;border-radius:11px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;font-size:13px;transition:transform .18s}
    .not-found a:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p class="not-found-code">404</p>
      <h1>Where is bro going</h1>
      <p>This page doesn't exist. Bro took a wrong turn.</p>
      <a href="./">Back to ORB1TAL</a>
    </div>
  </main>
</body>
</html>
